services:
  - type: web
    name: gold-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JIN10_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
